<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Проверка контрагентов — макет интерфейса</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* Токены — подмножество @alfalab/core-components-vars (colors-bluetint) */
  :root{
    --text-primary: rgba(3,3,6,.88);
    --text-secondary: rgba(4,4,19,.55);
    --text-tertiary: rgba(5,8,29,.38);
    --text-link: #0b1f35;
    --bg-primary:#fff;
    --bg-secondary:#f3f4f5;
    --bg-tertiary:#e9eaee;
    --border:rgba(11,31,53,.12);
    --negative:#ff4837; --negative-text:#ec2d20; --negative-bg:#ffebeb;
    --attention:#fa9313; --attention-text:#ea8313; --attention-bg:#ffefd9;
    --positive:#0cc44d; --positive-text:#0d9336; --positive-bg:#e6f8ec;
    --info-bg:#f3f4f5;
    --accent:#ef3124;
    --r12:12px; --r8:8px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:var(--font);color:var(--text-primary);background:var(--bg-secondary);font-size:15px;line-height:20px}
  button{font:inherit;cursor:pointer}
  h1,h2,h3{margin:0;font-weight:600}
  h1{font-size:20px;line-height:24px}
  h2{font-size:16px;line-height:20px}
  h3{font-size:13px;line-height:18px;color:var(--text-secondary);font-weight:500}
  .muted{color:var(--text-secondary)} .tertiary{color:var(--text-tertiary)} .small{font-size:13px;line-height:18px}
  .mono{font-family:var(--mono);font-size:12px}
  .row{display:flex;gap:8px;align-items:center}

  header{height:56px;background:var(--bg-primary);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:16px}
  header .logo{width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}
  header .spacer{flex:1}

  /* Сетка: чат по центру, панель «Подробности» справа, по умолчанию свёрнута до рейки */
  .layout{display:flex;gap:16px;padding:16px 24px 24px;height:calc(100% - 56px);min-width:1200px;justify-content:center}
  .panel{background:var(--bg-primary);border-radius:var(--r12);border:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
  .chat{flex:1 1 800px;max-width:800px;min-width:480px}
  .details{flex:0 0 580px;min-width:0;display:none}
  .layout[data-panel="open"] .chat{max-width:none}
  .layout[data-panel="open"] .details{display:flex}
  .layout[data-panel="wide"] .chat{flex:0 0 420px;max-width:420px;min-width:420px}
  .layout[data-panel="wide"] .details{display:flex;flex:1 1 auto}
  .rail{flex:0 0 44px;border-radius:var(--r12);border:1px solid var(--border);background:var(--bg-primary);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:12px;cursor:pointer;color:var(--text-secondary)}
  .rail:hover{background:var(--bg-secondary);color:var(--text-primary)}
  .rail .vt{writing-mode:vertical-rl;transform:rotate(180deg);font-size:13px;font-weight:500;letter-spacing:.02em;white-space:nowrap}
  .rail .arr{font-size:16px}
  .layout:not([data-panel="closed"]) .rail,.layout.nosession .rail{display:none}
  .panel-body{padding:16px;overflow:auto;flex:1;min-height:0}
  .details-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:flex-start}
  .details-head .ttl{flex:1;min-width:0}
  .details-head .ttl h2{font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .details-head .icons{display:flex;gap:2px;flex:none}
  .ibtn{width:28px;height:28px;border:0;background:transparent;border-radius:6px;color:var(--text-secondary);font-size:15px;line-height:1}
  .ibtn:hover{background:var(--bg-secondary);color:var(--text-primary)}

  .btn{height:40px;border-radius:var(--r8);border:0;padding:0 14px;font-weight:500}
  .btn.primary{background:#0b1f35;color:#fff} .btn.primary:disabled{opacity:.4;cursor:default}
  .btn.secondary{background:var(--bg-secondary);color:var(--text-primary)}
  .btn.ghost{background:transparent;color:var(--text-secondary)}
  .btn.sm{height:30px;padding:0 10px;font-size:13px}

  /* Шапка чата: сессия живёт здесь */
  .chat-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
  .chat-head .top{display:flex;gap:10px;align-items:center}
  .chat-head .top .counter{margin-left:auto;font-size:13px;color:var(--text-secondary);white-space:nowrap}
  .chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:28px}
  .chips .label{font-size:13px;color:var(--text-secondary);margin-right:2px}
  .cchip{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 4px 0 9px;border-radius:14px;border:1px solid var(--border);background:var(--bg-primary);cursor:pointer;max-width:240px}
  .cchip:hover{background:var(--bg-secondary)}
  .cchip.active{border-color:#0b1f35;box-shadow:inset 0 0 0 1px #0b1f35}
  .cchip .name{font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cchip .warn{color:var(--negative-text);font-weight:700;font-size:12px}
  .cchip .x{border:0;background:none;color:var(--text-tertiary);font-size:15px;line-height:14px;padding:2px 5px;border-radius:50%}
  .cchip .x:hover{background:var(--bg-tertiary);color:var(--text-primary)}
  .cchip.deal{background:var(--bg-secondary);border-style:dashed;cursor:default}
  .cchip.deal .name{font-weight:400}

  /* Статус-метка */
  .status{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:10px;font-size:12px;line-height:16px;font-weight:500;white-space:nowrap}
  .status.green{background:var(--positive-bg);color:var(--positive-text)}
  .status.orange{background:var(--attention-bg);color:var(--attention-text)}
  .status.red{background:var(--negative-bg);color:var(--negative-text)}
  .status.grey{background:var(--bg-tertiary);color:var(--text-secondary)}
  .badge{background:var(--bg-tertiary);border-radius:10px;padding:0 6px;font-size:12px;line-height:18px;font-weight:500;color:var(--text-secondary)}

  /* Оценка банка в сводке чата — компактные метки */
  .bank-assess{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
  .bank-assess-k{font-size:12px;line-height:16px;color:var(--text-secondary);font-weight:500}
  .signals-fold{margin-top:4px}
  .signals-fold summary{font-weight:500}
  .steps-block{margin-top:0;margin-bottom:12px}
  .steps-block h2{font-size:15px;margin-bottom:8px}
  .llm-summary{margin:0 0 12px;padding:12px 16px}
  .llm-summary h2{font-size:13px;line-height:16px;font-weight:500;margin-bottom:8px;color:var(--text-secondary)}
  .llm-summary p{margin:0 0 8px;font-size:14px;line-height:1.5;font-weight:400}
  .llm-summary p:last-child{margin-bottom:0;font-size:13px;color:var(--text-secondary)}

  .subject{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
  .subject .title{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

  /* Факт сводки (в чате и в панели): полярность — полоса слева и фон, без пиктограмм */
  .fact{padding:10px 12px;border-radius:var(--r12);border:1px solid var(--border);border-left-width:4px;margin-bottom:6px;cursor:pointer}
  .fact:hover{filter:brightness(.985)}
  .fact .slot{font-size:12px;line-height:16px;color:var(--text-secondary);margin-bottom:1px}
  .fact .text{font-weight:500;line-height:1.45}
  .fact.negative{border-left-color:var(--negative);background:var(--negative-bg)}
  .fact.caution{border-left-color:var(--attention);background:var(--attention-bg)}
  .fact.gap{border-left-color:var(--text-tertiary);border-style:dashed;border-left-style:solid;background:var(--bg-secondary)}
  .fact.info{border-left-color:var(--text-secondary);background:var(--info-bg)}
  .fact.positive{border-left-color:var(--positive);background:var(--positive-bg)}

  .plate{border-radius:var(--r12);padding:14px 16px;margin-top:16px;border:1px solid var(--border)}
  .plate h2{margin-bottom:8px;font-size:15px}
  .plate.gap{border-style:dashed;background:transparent}
  .plate.attention{background:var(--attention-bg);border-color:transparent}
  .plate.negative{background:var(--negative-bg);border-color:transparent}
  .plate.common{background:var(--bg-secondary);border-color:transparent}
  .plate ol,.plate ul{margin:0;padding-left:20px} .plate li{margin:4px 0}
  .plate li .why{color:var(--text-secondary);font-size:13px}
  .alert{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:var(--r12);background:var(--negative-bg);color:var(--negative-text);font-weight:600;margin-bottom:8px}
  .foot{margin-top:10px;font-size:12px;color:var(--text-tertiary);display:flex;gap:8px;align-items:center}
  .spinner{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--text-secondary);border-radius:50%;animation:spin 1s linear infinite;display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Карточка */
  .block{border:1px solid var(--border);border-radius:var(--r12);margin-bottom:12px;transition:box-shadow .3s}
  .block.hl{box-shadow:0 0 0 3px #ffd75e}
  .block > summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;align-items:center;gap:10px;font-weight:600}
  .block > summary::-webkit-details-marker{display:none}
  .block > summary::after{content:"⌄";margin-left:auto;color:var(--text-tertiary);font-size:18px;transition:transform .2s}
  .block[open] > summary::after{transform:rotate(180deg)}
  .block .body{padding:0 16px 16px}
  .kv{display:grid;grid-template-columns:200px 1fr;gap:6px 16px;font-size:14px}
  .kv .k{color:var(--text-secondary)} .kv .v{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
  .sig{display:inline-flex;gap:4px;align-items:center;font-size:12px;color:var(--text-secondary)}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
  th{font-weight:500;color:var(--text-secondary);font-size:13px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .chart{display:flex;gap:24px;align-items:flex-end;height:140px;padding:8px 8px 0;border-bottom:1px solid var(--border);margin:8px 0 6px}
  .chart .yr{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
  .chart .bars{display:flex;gap:4px;align-items:flex-end;height:100%;width:100%;justify-content:center}
  .chart .bar{width:26px;border-radius:4px 4px 0 0;background:#0b1f35;position:relative}
  .chart .bar.profit{background:#8c99a6}
  .chart .bar span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--text-secondary);white-space:nowrap}
  .chart .nodata{width:100%;height:100%;border:1.5px dashed var(--text-tertiary);border-radius:6px;display:grid;place-items:center;color:var(--text-tertiary);font-size:12px}
  .chart-x{display:flex;gap:24px;padding:0 8px}
  .chart-x div{flex:1;text-align:center;font-size:12px;color:var(--text-secondary)}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--text-secondary);margin-bottom:8px;flex-wrap:wrap}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
  .seg{display:inline-flex;background:var(--bg-secondary);border-radius:8px;padding:2px}
  .seg button{border:0;background:none;padding:4px 10px;border-radius:6px;font-size:13px;color:var(--text-secondary);white-space:nowrap}
  .seg button.on{background:#fff;color:var(--text-primary);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  details.col summary{cursor:pointer;color:var(--text-secondary);font-size:13px;list-style:none}
  details.col summary::before{content:"▸ "} details.col[open] summary::before{content:"▾ "}

  /* Сравнение: матрица */
  .toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:0 0 8px}
  .toolbar .grow{flex:1}
  .mx-wrap{overflow:auto;border:1px solid var(--border);border-radius:var(--r12)}
  .mx{font-size:13px;min-width:760px}
  .mx th{position:sticky;top:0;background:var(--bg-primary);z-index:2;font-size:12px}
  .mx th:nth-child(2),.mx td:nth-child(2){position:sticky;left:0;background:var(--bg-primary);z-index:1;min-width:170px;max-width:210px}
  .mx th:nth-child(2){z-index:3}
  .mx td:first-child,.mx th:first-child{width:28px;padding-right:0}
  .mx td{vertical-align:top;line-height:17px}
  .mx tr.sel td{background:#f6f8fb}
  .mx .cn{font-weight:600;cursor:pointer} .mx .cn:hover{text-decoration:underline}
  .mx .item{margin:1px 0;padding:2px 6px;border-radius:6px}
  .mx .item.negative{background:var(--negative-bg)}
  .mx .item.caution{background:var(--attention-bg)}
  .mx .item.gap{background:var(--bg-secondary);border:1px dashed var(--text-tertiary)}
  .mx .item span{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .mx.expanded .item span{display:block}
  .mx .more{color:var(--text-secondary);font-size:12px;cursor:pointer;margin-left:20px}
  .mx.expanded .more{display:none}
  .mx .hidden-item{display:none} .mx.expanded .hidden-item{display:block}
  .cmp th:first-child,.cmp td:first-child{width:150px;color:var(--text-secondary);font-weight:500;background:var(--bg-primary);position:sticky;left:0}
  .cmp th{vertical-align:top}
  .cmp th .cname{color:var(--text-primary);font-weight:600;font-size:14px;cursor:pointer}
  .cmp td{font-size:14px}
  .cmp .item{margin:2px 0;padding:2px 6px;border-radius:6px}
  .cmp .item.negative{background:var(--negative-bg)}
  .cmp .item.caution{background:var(--attention-bg)}
  .cmp .item.gap{background:var(--bg-secondary);border:1px dashed var(--text-tertiary)}
  .gridN{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:8px}
  .gridN .plate{margin:0}
  .crit{display:grid;grid-template-columns:140px 1fr;gap:4px 12px;font-size:13px;margin-top:8px}
  .crit .k{color:var(--text-secondary)}
  .crit .g{display:inline-block;margin-right:12px;padding:2px 6px;border-radius:6px}
  .crit .g.negative{background:var(--negative-bg)}
  .crit .g.caution{background:var(--attention-bg)}
  .crit .g.gap{background:var(--bg-secondary);border:1px dashed var(--text-tertiary)}
  .crit .g.positive{background:var(--positive-bg)}

  /* Динамика по годам */
  .ychart{margin-top:8px}
  .ychart svg{width:100%;height:auto;display:block}
  .ychart .lbl{font-size:11px;fill:var(--text-secondary)}
  .ychart .ax{stroke:var(--border)}
  .ychart .ln{fill:none;stroke-width:2;transition:opacity .15s}
  .ychart .pt{stroke:#fff;stroke-width:1.5}
  .ychart .end{font-size:11px;font-weight:500}
  .ychart.dim .ln,.ychart.dim .pt,.ychart.dim .end{opacity:.18}
  .ychart.dim .ln.on,.ychart.dim .pt.on,.ychart.dim .end.on{opacity:1}
  .lchip{display:inline-flex;gap:6px;align-items:center;font-size:12px;padding:3px 8px;border-radius:12px;border:1px solid var(--border);cursor:pointer;background:var(--bg-primary)}
  .lchip.off{opacity:.4;text-decoration:line-through}
  .lchip i{width:10px;height:3px;border-radius:2px;display:inline-block}
  .smalls{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:8px}
  .sm-c{border:1px solid var(--border);border-radius:var(--r8);padding:8px 10px}
  .sm-c .t{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center;justify-content:space-between}
  .sm-c svg{width:100%;height:70px;display:block;margin-top:4px}

  /* Чат */
  .chat-flow{display:flex;flex-direction:column;flex:1;min-height:0}
  .msgs{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:14px;min-height:0}
  .msg{max-width:100%;font-size:14px;line-height:20px}
  .msg.user{align-self:flex-end;background:var(--bg-secondary);border-radius:var(--r12) var(--r12) 4px var(--r12);padding:10px 12px;max-width:80%}
  .msg.agent{align-self:stretch}
  .msg.agent p{margin:0 0 8px} .msg.agent p:last-child{margin:0}
  .msg.agent ul,.msg.agent ol{margin:4px 0 8px;padding-left:18px}
  .msg .hdr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .msg .hdr b{font-size:15px}
  .msg .hdr .meta{font-size:12px;color:var(--text-tertiary)}
  .msg .sys{background:var(--bg-secondary);border-left:3px solid var(--text-tertiary);padding:8px 10px;border-radius:0 8px 8px 0;color:var(--text-secondary);font-size:13px}
  .msg .err{background:var(--negative-bg);border-left:3px solid var(--negative);padding:8px 10px;border-radius:0 8px 8px 0;color:var(--negative-text);font-size:13px}
  .msg .gapbox{border:1px dashed var(--text-tertiary);border-radius:8px;padding:6px 10px;color:var(--text-secondary);font-size:13px;margin:6px 0;background:var(--bg-secondary)}
  .msg .okline{display:flex;gap:8px;align-items:center;color:var(--text-secondary);font-size:13px;margin:4px 0 6px}
  .msg .step{background:var(--attention-bg);border-radius:8px;padding:8px 10px;font-size:13px;margin-top:6px}
  .msg .step .why{color:var(--text-secondary)}
  .msg details.fold{margin:4px 0 6px}
  .msg details.fold summary{cursor:pointer;font-size:13px;color:var(--text-secondary);list-style:none}
  .msg details.fold summary::before{content:"▸ "} .msg details.fold[open] summary::before{content:"▾ "}
  .msg details.fold .fact{margin-top:6px}
  .msg .actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
  .msg .actions .lnk{border:0;background:none;color:var(--text-link);font-size:13px;padding:0;text-decoration:underline;text-underline-offset:2px}
  .msg table{font-size:13px} .msg td,.msg th{padding:4px 6px}
  .msg tr.pick{cursor:pointer} .msg tr.pick:hover td{background:var(--bg-secondary)}
  .msg .crit{margin-top:6px}
  .chip{border:1px solid var(--border);background:var(--bg-primary);border-radius:16px;padding:4px 10px;font-size:13px;color:var(--text-primary);white-space:nowrap}
  .chip:hover{background:var(--bg-secondary)}
  .chip.go{border-color:#0b1f35}
  .check{font-size:12px;color:var(--text-tertiary);margin-top:6px} .check summary{cursor:pointer;list-style:none}
  .suggest{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px dashed var(--border)}
  .suggest .lbl{font-size:12px;color:var(--text-tertiary);align-self:center}
  .compose{display:flex;gap:8px;padding:12px 20px 14px;align-items:flex-end;border-top:1px solid var(--border)}
  .compose textarea{flex:1;resize:none;border:1px solid var(--border);border-radius:var(--r8);padding:12px;font:inherit;min-height:48px;max-height:104px}
  .compose textarea::placeholder{color:var(--text-tertiary);opacity:1}
  .compose button{width:48px;height:48px;border-radius:var(--r8);border:0;background:#0b1f35;color:#fff;font-size:18px}
  /* Пустая сессия: task-first launcher вместо приветственного сообщения */
  .launcher{display:none;flex-direction:column;align-items:center;gap:20px;max-width:640px;width:100%;margin:0 auto;padding:0 20px 12vh}
  .launcher-title{font-size:22px;line-height:28px;font-weight:600;color:var(--text-primary);text-align:center;margin:0;max-width:560px}
  .launcher-intro{font-size:15px;line-height:22px;color:var(--text-secondary);text-align:center;margin:0;max-width:560px}
  .launcher-compose{display:flex;gap:8px;width:100%;align-items:stretch}
  .launcher-compose input{flex:1;border:1px solid var(--border);border-radius:var(--r8);padding:0 16px;font:inherit;font-size:15px;height:52px;min-width:0;background:var(--bg-primary)}
  .launcher-compose input::placeholder{color:var(--text-tertiary)}
  .launcher-compose input:focus{outline:2px solid rgba(11,31,53,.18);outline-offset:0;border-color:#0b1f35}
  .launcher-compose .launcher-btn{height:52px;padding:0 20px;border-radius:var(--r8);border:0;background:#0b1f35;color:#fff;font-weight:500;font-size:15px;white-space:nowrap;flex:none}
  .launcher-compose .launcher-btn:hover{background:#152a42}
  .launcher-examples{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .launcher-examples .chip{background:var(--bg-secondary);border-color:transparent;color:var(--text-secondary);font-size:13px;padding:6px 12px}
  .launcher-examples .chip:hover{background:var(--bg-tertiary);color:var(--text-primary)}

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const status = (label,color) => `<span class="status ${color}">${label}</span>`;

const zskStatus = c => status(...ZSK[c.zsk]);
/* Технические пути полей хранятся в данных и data-ref, но не выводятся пользователю. */
const ref = () => '';
const ico = () => '';
const fmt1 = v => v.toLocaleString('ru-RU',{minimumFractionDigits:1,maximumFractionDigits:1});
const mln = v => v==null ? '<span class="tertiary">нет данных</span>' : (Math.abs(v)>=1000 ? fmt1(v/1000)+' млрд ₽' : Math.abs(v)<1 ? fmt1(v*1000)+' тыс. ₽' : fmt1(v)+' млн ₽');
const mlnT = v => mln(v).replace(/<[^>]+>/g,'');
const mlnShort = v => Math.abs(v)>=1000 ? fmt1(v/1000)+' млрд' : Math.abs(v)<1 ? Math.round(v*1000)+' тыс' : (Math.abs(v)>=100?Math.round(v):fmt1(v))+' млн';
const worst = items => items.reduce((w,[p])=>POL_ORDER[p]<POL_ORDER[w]?p:w,'positive');
const cs = () => S.session.map(i=>DB[i]);
const lc = s => s.charAt(0).toLowerCase()+s.slice(1);
const GAP_REFS = [
  {re:/inspections/, slot:'Юридические события', short:'Проверки контролирующих органов отсутствуют.'},
  {re:/finReports\[\]\.common\.proceeds/, slot:'Финансы', short:g=>g.text.charAt(0).toUpperCase()+g.text.slice(1)+'.'},
  {re:/finReports\[\]\.common/, slot:'Финансы', short:'Отчётность без показателей выручки и прибыли.'},
  {re:/finReports/, slot:'Финансы', short:g=>/ИП/i.test(g.text)?'Бухгалтерская отчётность отсутствует.':'Финансовая отчётность отсутствует.'},
  {re:/baseInfo\.riskLevel/, slot:'Оценка банка', short:'Уровень риска банка не определён.'},
  {re:/reputationalRisks/, slot:'Реестры ФНС', short:'Сведения по реестрам ФНС отсутствуют.'},
];
const gapMeta = ref => (GAP_REFS.find(x=>x.re.test(ref))||{slot:'Полнота данных', short:g=>g.text.charAt(0).toUpperCase()+g.text.slice(1)+(g.text.endsWith('.')?'':'.')});
const gapBody = g => { const m=gapMeta(g.ref); return typeof m.short==='function'?m.short(g):m.short; };
const gapFact = g => { const {slot}=gapMeta(g.ref); return `<div class="fact gap" data-ref="${esc(g.ref)}"><div class="slot">${esc(slot)}</div><div class="text">${esc(gapBody(g))}</div></div>`; };
const GROUP_TIER = {negative:0, caution:1, gap:2, info:2, positive:3};
const signalItemFromFact = f => ({slot:f.slot, pol:f.pol, text:f.text, refs:f.refs});
const signalItemFromGap = g => ({slot:gapMeta(g.ref).slot, pol:'gap', text:gapBody(g), refs:[g.ref]});
const groupKey = (slot, pol) => `${slot}\0${GROUP_TIER[pol]??4}`;
const sortSignalItems = items => {
  const order=[], buckets=new Map();
  items.forEach((it,i)=>{ const k=groupKey(it.slot,it.pol); if(!buckets.has(k)){buckets.set(k,[]); order.push(k);} buckets.get(k).push({it,i}); });
  order.sort((a,b)=>{
    const minA=Math.min(...buckets.get(a).map(x=>POL_ORDER[x.it.pol]));
    const minB=Math.min(...buckets.get(b).map(x=>POL_ORDER[x.it.pol]));
    return minA!==minB?minA-minB:order.indexOf(a)-order.indexOf(b);
  });
  return order.flatMap(k=>buckets.get(k).sort((a,b)=>POL_ORDER[b.it.pol]-POL_ORDER[a.it.pol]||a.i-b.i).map(x=>x.it));
};
const factCard = it => `<div class="fact ${it.pol}" data-ref="${esc(it.refs[0])}"><div class="slot">${esc(it.slot)}</div><div class="text">${esc(it.text)}</div></div>`;
const signalItems = c => {
  const facts=c.facts.filter(f=>f.slot!=='Оценка банка').map(signalItemFromFact);
  const gaps=c.gaps.map(signalItemFromGap).filter(gi=>!facts.some(fi=>fi.slot===gi.slot&&fi.pol==='gap'));
  return sortSignalItems([...facts,...gaps]);
};
const hasAlertSignals = items => items.some(it=>it.pol==='negative'||it.pol==='caution'||it.pol==='gap');
const gapsNote = () => '<div class="small muted" style="margin-top:4px">Отсутствие сведений в отчёте банка не означает отсутствие риска.</div>';
const names = list => list.map(c=>esc(c.short)).join(', ');
const dealCell = c => {
  const amt=S.deal.amount; const last=[...c.fin].reverse().find(f=>f.pr);
  if(!last) return ['gap','Выручка неизвестна; соразмерность оценить нельзя'];
  return amt>last.pr ? ['caution',`Сумма сделки (${mlnT(amt)}) превышает выручку за ${last.y} (${mln(last.pr)})`] : ['info',`Сумма сделки в пределах выручки за ${last.y} (${mln(last.pr)})`];
};
const cellItems = (c,k) => k==='deal' ? [dealCell(c)] : c.cmp[k];
const rows = () => S.deal.amount ? [...ROWS,['Соразмерность сделки','deal']] : ROWS;
/* Счётчики: сигналы строк сравнения + сигналы слота «Дополнительно» (возраст, смены руководителя/учредителя), которые в таблицу не входят */
const counts = c => { const all=[...rows().flatMap(([,k])=>cellItems(c,k)), ...c.facts.filter(f=>f.slot==='Дополнительно').map(f=>[f.pol,f.text])]; return {neg:all.filter(([p])=>p==='negative').length, cau:all.filter(([p])=>p==='caution').length, gap:c.gaps.length}; };
/* Порядок матрицы — по возрастанию риска, ключ явный и показан в подписи под таблицей:
   метка банка LOW → MEDIUM → HIGH (UNKNOWN в конце) → предупреждение по статусу → число negative → число caution → порядок добавления */
const RISK_RANK = {LOW:0, MEDIUM:1, HIGH:2, UNKNOWN:3};
const riskKey = c => { const k=counts(c); return [RISK_RANK[c.risk], c.headline?1:0, k.neg, k.cau, S.session.indexOf(c.inn)]; };
const byRisk = list => [...list].sort((a,b)=>{ const ka=riskKey(a), kb=riskKey(b); for(let i=0;i<ka.length;i++) if(ka[i]!==kb[i]) return ka[i]-kb[i]; return 0; });
const findByName = t => cs().find(c=>t.includes(c.short.toLowerCase()) || t.includes(c.short.toLowerCase().replace(/^ип\s+/,'').split(' ')[0]));
const findAllByName = t => cs().filter(c=>t.includes(c.short.toLowerCase()) || t.includes(c.short.toLowerCase().replace(/^ип\s+/,'').split(' ')[0]));

/* ---------- Сводка в чате (основной ответ агента) ---------- */
function bankHeroHtml(c){
  return `<div class="bank-assess" id="bank-assess"><span class="bank-assess-k">Оценка банка</span>${riskStatus(c)}${zskStatus(c)}${c.risk==='UNKNOWN'?`<span class="status grey">уровень риска не определён</span>`:''}</div>`;
}
/* Краткий вывод LLM: в проде — отдельный вызов модели по signals + profile + dealContext; в макете — по тем же данным */
function llmBriefText(c){
  const okvedShort=(c.okved||'').split(' — ')[0];
  const risk=RISK[c.risk][0], zsk=ZSK[c.zsk][0].replace(/^ЗСК\s+/,'');
  const paras=[];
  let intro=c.isIP?`Индивидуальный предприниматель ${c.short}, ${c.age} на рынке`:`Компания ${c.short} (${c.age}, основной ОКВЭД ${okvedShort})`;
  intro+=`. Банк оценивает контрагента как «${risk}», программа «Знай своего клиента» — «${zsk}».`;
  if(c.risk==='UNKNOWN') intro+=' Уровень риска банка в отчёте не определён — модель банка может учитывать данные, которых здесь нет.';
  paras.push(intro);
  if(c.headline) paras.push(`Важно: ${c.headline.replace(/\.$/,'')}.`);
  const neg=c.facts.filter(f=>f.pol==='negative'), cau=c.facts.filter(f=>f.pol==='caution');
  if(neg.length||cau.length) paras.push(`Стоит обратить внимание на: ${[...neg,...cau].map(f=>f.text.replace(/\.$/,'')).join('; ')}.`);
  else{ const pos=c.facts.filter(f=>f.pol==='positive'); const pt=pos.length?pos[0].text.replace(/\.$/,''):''; paras.push(pt?`Существенных негативных сигналов в отчёте не видно; ${pt.charAt(0).toLowerCase()+pt.slice(1)}.`:'Явных негативных сигналов в доступных данных не обнаружено.'); }
  if(c.gaps.length) paras.push(`Есть пробелы: ${c.gaps.map(g=>gapBody(g).replace(/\.$/,'')).join('; ')}. Отсутствие сведений в отчёте не означает отсутствие риска.`);
  if(S.deal.goal||S.deal.amount){
    const dealLbl=[S.deal.goal, S.deal.amount?`на ${mlnT(S.deal.amount)}`:null].filter(Boolean).join(' ');
    if(S.deal.goal==='госзакупка') paras.push(`При цели «${dealLbl}» имеет смысл отдельно проверить опыт участия в закупках и соответствие ОКВЭД предмету контракта.`);
    else if(S.deal.amount){ const [dc]=dealCell(c);
      if(dc==='caution') paras.push(`В контексте сделки ${dealLbl} сумма выглядит высокой относительно годовой выручки — разумно заложить постоплату или обеспечение.`);
      else if(dc==='gap') paras.push(`Для сделки ${dealLbl} масштаб по выручке оценить сложно из‑за пробелов в отчётности — запросите дополнительные документы.`);
      else paras.push(`Для планируемой сделки (${dealLbl}) по масштабу выглядит приемлемо, но перечисленные риски всё равно стоит закрыть до подписания.`);
    } else paras.push(`С учётом цели «${S.deal.goal}» сфокусируйтесь на шагах проверки ниже.`);
  }
  paras.push('Итоговое решение о сотрудничестве остаётся за вами; ниже — конкретные шаги и факты отчёта.');
  return paras;
}
function llmBriefHtml(c){
  if(S.llmOff) return '';
  return `<div class="plate common llm-summary"><h2>Краткий вывод</h2>${llmBriefText(c).map(p=>`<p>${esc(p)}</p>`).join('')}</div>`;
}
function stepsHtml(c,full){
  if(!c.steps.length) return '';
  if(full) return `<div class="plate attention steps-block"><h2>Что проверить до сделки</h2><ol>${c.steps.map(s=>`<li>${esc(s.text)} <span class="why">(${esc(s.why)})</span></li>`).join('')}</ol><div class="small muted" style="margin-top:8px">Рекомендации — из фиксированной таблицы «сигнал → шаг». Решение о сделке остаётся за вами.</div></div>`;
  return `<div class="plate attention steps-block"><h2>Что проверить до сделки</h2><ol>${c.steps.map(s=>`<li>${esc(s.text)} <span class="why">(${esc(s.why)})</span></li>`).join('')}</ol></div>`;
}
function summaryHtml(c){
  const items=signalItems(c);
  const total=(c.headline?1:0)+items.length;
  const cards=items.map(factCard).join('');
  const signals=`<details class="fold signals-fold"><summary>Результаты анализа${total?` · ${total}`:''}</summary>
  ${c.headline?`<div class="alert">${esc(c.headline)} ${ref('status.reasonName')}</div>`:''}
  ${!hasAlertSignals(items)?`<div class="okline">Негативных и требующих внимания сигналов нет.</div>`:''}
  ${cards}
  ${c.gaps.length?gapsNote():''}
  </details>`;
  return `<div class="hdr"><b>${esc(c.name)}</b><span class="meta">ИНН ${c.inn} · отчёт от ${c.report}</span></div>
  ${bankHeroHtml(c)}
  ${llmBriefHtml(c)}
  ${stepsHtml(c)}
  ${signals}
  <div class="actions"><button class="chip go" data-pview="card" data-inn="${c.inn}">Подробности в панели →</button>${S.session.length>1?`<button class="lnk" data-q="В чём различия?">сравнить с остальными</button>`:''}</div>
  ${S.llmOff?`<div class="foot">Текст сформирован по правилам без языковой модели.</div>`:''}`;
}
/* Итоги сравнения — ответ агента на «сравни» / «различия» и при добавлении нескольких ИНН */
function totalsHtml(intro){
  const list=cs(), n=list.length;
  const headl=list.filter(c=>c.headline), withNeg=list.filter(c=>counts(c).neg>0), withGap=list.filter(c=>c.gaps.length>0), clean=list.filter(c=>counts(c).neg===0&&counts(c).cau===0);
  const crit=rows().filter(([,k])=>k!=='bank'&&k!=='gapsRow').map(([name,k])=>{
    const g=groupsByCriterion(k); const part=[];
    if(g.negative.length) part.push(`<span class="g negative"><span>${names(g.negative.map(([c])=>c))}</span></span>`);
    if(g.caution.length) part.push(`<span class="g caution"><span>${names(g.caution.map(([c])=>c))}</span></span>`);
    if(g.gap.length) part.push(`<span class="g gap"><span>оценить нельзя: ${names(g.gap.map(([c])=>c))}</span></span>`);
    if(!part.length) part.push(`<span class="g positive"><span>негативных сигналов ни у кого</span></span>`);
    return `<div class="k">${name}</div><div>${part.join('')}</div>`;
  }).join('');
  return `${intro?`<p>В сессии ${n} компаний. Итоги по единому набору критериев:</p>`:''}
  <p>${headl.length?`Предупреждение по статусу у ${headl.length}: ${names(headl)}. `:''}Негативные сигналы у ${withNeg.length} из ${n}${withNeg.length?` (${names(withNeg)})`:''}; без негативных и требующих внимания — ${clean.length?names(clean):'никого'}. Пробелы в данных у ${withGap.length}: отсутствие сведений не означает отсутствие риска.</p>
  ${headl.map(c=>`<div class="alert" style="font-size:13px;font-weight:500;padding:8px 10px">${ico('negative','xs')} <b>${esc(c.short)}:</b> ${esc(c.headline)}</div>`).join('')}

  <div class="actions"><button class="chip go" data-pview="compare">Матрица сигналов в панели →</button><button class="lnk" data-pview="chart">динамика по годам</button></div>
  <div class="foot">${S.llmOff?'Текст сформирован по правилам без языковой модели. ':''}Баллов и вердикта нет; в матрице строки идут по возрастанию риска, ключ порядка подписан.</div>`;
}

/* ---------- Сравнение (панель) ---------- */
function groupsByCriterion(k,list){
  const g={negative:[],caution:[],gap:[],clean:[]};
  (list||cs()).forEach(c=>{ const it=cellItems(c,k); const w=worst(it); (g[w]||g.clean).push([c,it]); });
  return g;
}
function filtered(){
  return byRisk(cs()).filter(c=> S.filter==='all' || (S.filter==='neg'&&counts(c).neg>0) || (S.filter==='gap'&&c.gaps.length>0) || (S.filter==='head'&&c.headline));
}
const FILTER_LABEL={neg:'только с негативными сигналами',gap:'только с пробелами в данных',head:'только с предупреждением по статусу'};
function renderMatrix(){

  return `
  <div class="toolbar">
    <h2>Матрица сигналов</h2>
    ${S.filter!=='all'?`<span class="badge">${FILTER_LABEL[S.filter]} · ${list.length} из ${S.session.length}</span><button class="btn ghost sm" data-filter="all">показать всех</button>`:''}
    <div class="grow"></div>
    <button class="btn ghost sm" data-expand="1">${S.expanded?'Свернуть ячейки':'Развернуть ячейки'}</button>
    <button class="btn ${S.focus.length>=2?'primary':'secondary'} sm" data-focus="1" ${S.focus.length<2?'disabled':''}>Подробно выбранных${S.focus.length?` (${S.focus.length})`:''}</button>
  </div>
  <div class="mx-wrap"><table class="mx${S.expanded?' expanded':''}">
    <tr><th></th><th>Контрагент</th>${rs.map(([n])=>`<th>${n}</th>`).join('')}</tr>
    ${list.map(c=>`<tr class="${S.focus.includes(c.inn)?'sel':''}" data-row="${c.inn}">
      <td><input type="checkbox" data-pick="${c.inn}" ${S.focus.includes(c.inn)?'checked':''} ${!S.focus.includes(c.inn)&&S.focus.length>=4?'disabled title="В фокусе не больше 4"':''}></td>
      <td><div class="cn" data-open="${c.inn}">${esc(c.short)}</div><div class="mono muted">${c.inn}</div><div style="margin-top:3px">${riskStatus(c)}</div>${c.headline?`<div class="small" style="color:var(--negative-text);margin-top:3px">${ico('negative','xs')} ${esc(c.headline.split(' (')[0])}</div>`:''}</td>
      ${rs.map(([,k])=>`<td>${cell(c,k)}</td>`).join('')}</tr>`).join('')}
    ${!list.length?`<tr><td colspan="${rs.length+2}" class="muted" style="text-align:center;padding:20px">По этому фильтру контрагентов нет</td></tr>`:''}
  </table></div>
  <div class="small tertiary" style="margin-top:8px">Порядок строк — по возрастанию риска: метка банка (низкий → средний → высокий; «не определён» — в конце), затем предупреждение по статусу, затем число негативных сигналов. Это порядок, а не балл и не вердикт; выбор за вами. Отфильтровать можно фразой в чате («покажи только с негативными»), подробное сравнение 2–4 — чекбоксами или фразой «сравни А и Б подробно».</div>`;

function renderFocus(){
  const list=S.focus.map(i=>DB[i]), rs=rows();

    <tr><th>Критерий</th>${list.map(c=>`<th><div class="cname" data-open="${c.inn}">${esc(c.name)}</div><div class="mono muted">${c.inn}</div><div style="margin-top:4px">${riskStatus(c)}</div></th>`).join('')}</tr>
    ${rs.map(([n,k])=>`<tr><td>${n}</td>${list.map(c=>`<td>${cellItems(c,k).map(([p,t])=>`<div class="item ${p}"><span>${esc(t)}</span></div>`).join('')}</td>`).join('')}</tr>`).join('')}
  </table></div>`;

function diffsList(list){
  const out=[];
  rows().forEach(([name,k])=>{
    if(k==='bank') return;
    const g=groupsByCriterion(k,list);
    const kinds=['negative','caution','gap','clean'].filter(x=>g[x].length);
    if(kinds.length<2) return;
    const part=[];
    if(g.negative.length) part.push(g.negative.map(([c,it])=>`${esc(c.short)}: ${esc(it.filter(([p])=>p==='negative').map(([,t])=>lc(t)).join('; '))}`).join('. '));
    if(g.caution.length) part.push(g.caution.map(([c,it])=>`${esc(c.short)}: ${esc(lc(it.find(([p])=>p==='caution')[1]))}`).join('. '));
    if(g.gap.length) part.push(`${k==='gapsRow'?'Есть пробелы':'Оценить нельзя'}: ${names(g.gap.map(([c])=>c))}`);
    if(g.clean.length) part.push(`${k==='gapsRow'?'Все разделы заполнены':'Без негативных сигналов'}: ${names(g.clean.map(([c])=>c))}`);
    out.push(`<li><b>${name}.</b> ${part.join('. ')}.</li>`);
  });
  return out.length?`<ul>${out.join('')}</ul>`:`<div class="muted">По всем критериям полярности совпадают.</div>`;
}
function renderDiffs(list){ return `<div class="plate common"><h2>Различия</h2>${diffsList(list)}</div>`; }
function renderSteps(list){
  return `<h2 style="margin-top:20px">Что проверить до сделки</h2>
  <div class="gridN">${list.map(c=>`<div class="plate attention"><div style="font-weight:600;margin-bottom:6px">${esc(c.short)} ${riskStatus(c)}</div><ol style="padding-left:18px">${c.steps.map(s=>`<li class="small">${esc(s.text)} <span class="why">(${esc(s.why)})</span></li>`).join('')}</ol></div>`).join('')}</div>`;
}

/* ---------- Динамика по годам (панель) ---------- */
function seriesFor(list){
  const [k,name,r]=METRICS.find(m=>m[0]===S.metric);
  const ser=[], skipped=[];
  list.forEach(c=>{
    const pts=c.fin.filter(f=>f[k]!=null&&!(k==='pr'&&f[k]===0)).map(f=>({y:f.y,v:f[k]}));
    if(!pts.length){ skipped.push([c, c.isIP?'ИП не публикует отчётность':c.fin.length?'показатель не указан':'нет отчётности']); return; }
    ser.push({c,color:PALETTE[S.session.indexOf(c.inn)%PALETTE.length],pts:pts.map(p=>({y:p.y,raw:p.v,v:p.v}))});
  });
  return {k,name,r,ser,skipped};
}
const yLabel = v => mlnShort(v);
function renderYearChart(){
  const list=S.focusMode&&S.focus.length>=2?S.focus.map(i=>DB[i]):cs();
  const {name,r,ser,skipped}=seriesFor(list);
  const years=[...new Set(list.flatMap(c=>c.fin.map(f=>f.y)))].sort();
  /* Единственная шкала — рубли; вид выбирается по числу компаний: до 4 — общий график, от 5 — мини-графики */
  const view=ser.length>4?'small':'overlay';
  const ctl=`
  <div class="toolbar"><div class="seg">${METRICS.map(([mk,mn])=>`<button class="${S.metric===mk?'on':''}" data-metric="${mk}">${mn}</button>`).join('')}</div></div>
  <div class="small muted" style="margin-bottom:6px">${name}, млн ₽ ${ref(r)} · ${view==='small'?'у каждой компании своя ось от нуля; сравнивайте форму линии и процент, не высоту':'одна ось для всех; цвет линии — только для различения компаний'}.</div>`;
  if(!ser.length) return ctl+`<div class="plate gap" style="margin-top:0">${ico('gap','sm')} Ни у одной компании нет данных по этому показателю.</div>`+skippedNote(skipped);
  return ctl + (view==='overlay'?overlay(ser,years):smalls(ser,years)) + skippedNote(skipped);
}
function skippedNote(sk){ return sk.length?`<div class="small muted" style="margin-top:8px">${ico('gap','xs')} Не на графике: ${sk.map(([c,why])=>`${esc(c.short)} (${why})`).join('; ')}.</div>`:''; }
function overlay(ser,years){
  const W=820,H=280,L=84,R=120,T=16,B=32;
  const vis=ser.filter(s=>!S.hiddenLines.has(s.c.inn));
  const all=(vis.length?vis:ser).flatMap(s=>s.pts.map(p=>p.v));
  let mn=Math.min(0,...all), mx=Math.max(0,...all); if(mn===mx){ mn-=1; mx+=1; }
  const pad=(mx-mn)*0.08; if(mn<0) mn-=pad; if(mx>0) mx+=pad;
  const x=y=>L+(years.indexOf(y))*((W-L-R)/Math.max(1,years.length-1));
  const yy=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
  const ticks=[0,.25,.5,.75,1].map(t=>mn+(mx-mn)*t);
  const zero=(mn<0&&mx>0)?`<line class="ax" x1="${L}" x2="${W-R}" y1="${yy(0)}" y2="${yy(0)}" stroke-dasharray="3 3"/>`:'';
  const ends=vis.map(s=>({s,ly:yy(s.pts[s.pts.length-1].v)})).sort((a,b)=>a.ly-b.ly);
  for(let i=1;i<ends.length;i++) if(ends[i].ly-ends[i-1].ly<13) ends[i].ly=ends[i-1].ly+13;
  const labelY=Object.fromEntries(ends.map(e=>[e.s.c.inn,e.ly]));
  const lines=ser.map(s=>{ if(S.hiddenLines.has(s.c.inn)) return '';
    const d=s.pts.map((p,i)=>`${i?'L':'M'}${x(p.y)},${yy(p.v)}`).join(' ');
    const last=s.pts[s.pts.length-1];
    return `<g data-line="${s.c.inn}"><path class="ln" d="${d}" stroke="${s.color}"/>${s.pts.map(p=>`<circle class="pt" cx="${x(p.y)}" cy="${yy(p.v)}" r="3.5" fill="${s.color}"><title>${esc(s.c.short)} · ${p.y}: ${mlnT(p.raw)}</title></circle>`).join('')}<text class="end" x="${x(last.y)+8}" y="${labelY[s.c.inn]+4}" fill="${s.color}">${esc(s.c.short)}</text></g>`; }).join('');
  const v=(vis.length?vis:ser).flatMap(s=>s.pts.map(p=>Math.abs(p.raw))).filter(Boolean);
  const hint=v.length>1&&Math.max(...v)/Math.min(...v)>50?`<div class="small tertiary" style="margin-top:4px">Масштабы компаний различаются на порядки: линии малых компаний прижаты к оси. Скройте крупную компанию кликом по легенде.</div>`:'';
  return `<div class="ychart" id="ychart"><svg viewBox="0 0 ${W} ${H}">
    ${ticks.map(t=>`<line class="ax" x1="${L}" x2="${W-R}" y1="${yy(t)}" y2="${yy(t)}"/><text class="lbl" x="${L-8}" y="${yy(t)+4}" text-anchor="end">${yLabel(t)}</text>`).join('')}
    ${zero}
    ${years.map(y=>`<text class="lbl" x="${x(y)}" y="${H-10}" text-anchor="middle">${y}</text>`).join('')}
    ${lines}
  </svg></div>
  <div class="row" style="flex-wrap:wrap;gap:6px;margin-top:6px">${ser.map(s=>`<span class="lchip${S.hiddenLines.has(s.c.inn)?' off':''}" data-toggle="${s.c.inn}" data-hover="${s.c.inn}"><i style="background:${s.color}"></i>${esc(s.c.short)}</span>`).join('')}<span class="small tertiary" style="margin-left:6px">клик скрывает линию, наведение подсвечивает</span></div>${hint}`;
}
function smalls(ser,years){
  const W=200,H=70,L=20,R=20,T=10,B=14;
  return `<div class="smalls">${ser.map(s=>{
    const v=s.pts.map(p=>p.v); let mn=Math.min(0,...v), mx=Math.max(0,...v);
    if(mn===mx){ mn-=1; mx+=1; } const pad=(mx-mn)*.1; mn-=pad; mx+=pad;
    const x=y=>L+(years.indexOf(y))*((W-L-R)/Math.max(1,years.length-1)), yy=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
    const d=s.pts.map((p,i)=>`${i?'L':'M'}${x(p.y)},${yy(p.v)}`).join(' ');
    const first=s.pts[0], last=s.pts[s.pts.length-1];
    const pct=first.raw&&s.pts.length>1?Math.round((last.raw-first.raw)/Math.abs(first.raw)*100):null;
    return `<div class="sm-c"><div class="t"><span title="${esc(s.c.name)}">${esc(s.c.short)}</span>${pct!=null?`<span class="status ${S.metric==='stl'?'grey':pct>5?'green':pct<-5?'red':'grey'}" title="${S.metric==='stl'?'рост обязательств не оценивается цветом':'изменение первый → последний год'}">${pct>0?'+':''}${pct} %</span>`:`<span class="status grey">1 год</span>`}</div>
      <svg viewBox="0 0 ${W} ${H}"><path class="ln" d="${d}" stroke="#0b1f35" stroke-width="2" fill="none"/>${s.pts.map(p=>`<circle cx="${x(p.y)}" cy="${yy(p.v)}" r="3" fill="#0b1f35"><title>${p.y}: ${mlnT(p.raw)}</title></circle>`).join('')}${years.map(y=>`<text class="lbl" x="${x(y)}" y="${H-2}" text-anchor="middle">${y}</text>`).join('')}</svg>
      <div class="small muted" style="display:flex;justify-content:space-between"><span>${mlnT(first.raw)}</span><span>${mlnT(last.raw)}</span></div></div>`; }).join('')}</div>`;
}
/* Текстовая версия динамики для ответа в чате */
function trendText(){
  const {name,r,ser,skipped}=seriesFor(cs());
  const li=ser.map(s=>{ const f=s.pts[0], l=s.pts[s.pts.length-1]; if(s.pts.length<2) return `<li>${esc(s.c.short)}: ${mlnT(l.raw)} (${l.y}), только один год — тренд оценить нельзя</li>`;
    const pct=f.raw?Math.round((l.raw-f.raw)/Math.abs(f.raw)*100):null; return `<li>${esc(s.c.short)}: ${mlnT(f.raw)} (${f.y}) → ${mlnT(l.raw)} (${l.y})${pct!=null?`, ${pct>0?'+':''}${pct} %`:''}</li>`; }).join('');
  return `<p>${name} по годам ${ref(r)}:</p><ul>${li}</ul>${skipped.length?`<div class="gapbox">${ico('gap','xs')} Нет на графике: ${skipped.map(([c,why])=>`${esc(c.short)} (${why})`).join('; ')}.</div>`:''}<div class="actions"><button class="chip go" data-pview="chart">График в панели →</button>${METRICS.filter(m=>m[0]!==S.metric).slice(0,2).map(([k,n])=>`<button class="lnk" data-q="${n} по годам">${lc(n)}</button>`).join('')}</div>`;
}

/* ---------- Чат ---------- */
function addInn(inn){
  if(!DB[inn]) return {ok:false,html:`<div class="err">Отчёт по ИНН ${inn} в базе не найден.</div><p>В макете доступны 10 компаний — напишите «доступные ИНН».</p>`};
  if(S.session.includes(inn)){ S.selected=inn; setView('card',inn); S.ctx='company'; return {ok:true,html:`<p>${esc(DB[inn].name)} уже в сессии.</p>`+summaryHtml(DB[inn])}; }
  if(S.session.length>=MAX) return {ok:false,html:`<div class="err">В сессии не больше ${MAX} контрагентов. Удалите одного («убери Техпром»), чтобы добавить нового.</div>`};
  S.session.push(inn); S.selected=inn; S.focusMode=false; setView('card',inn); S.ctx='company';
  return {ok:true,html:summaryHtml(DB[inn])};
}
function agentAnswer(q){
  const t=q.toLowerCase().trim();
  const inns=[...new Set((q.match(/\d{10,12}/g)||[]).filter(x=>x.length===10||x.length===12))];
  if(/^доступн|доступные инн|какие инн|список компаний/.test(t)){ S.ctx=S.session.length?S.ctx:'start'; return `<p>В моковой базе макета 10 отчётов (в проде — 100, через инструмент <code>list_reports</code>). Клик по строке добавляет в сессию:</p><table><tr><th>ИНН</th><th>Компания</th><th>Метка банка</th></tr>${Object.values(DB).map(c=>`<tr class="pick" data-add="${c.inn}"><td class="mono">${c.inn}</td><td>${esc(c.short)}</td><td>${riskStatus(c)}</td></tr>`).join('')}</table>`; }
  if(/^(очист|сброс|начать заново|новая сессия)/.test(t)){ S.session=[]; S.deal={goal:null,amount:null}; S.focus=[]; S.focusMode=false; S.filter='all'; S.ctx='start'; return `<p>Сессия очищена. Введите ИНН, чтобы начать.</p>`; }
  if(/^(убери|удали|убрать|удалить|исключи)/.test(t)){
    const c = inns.length?DB[inns[0]]:findByName(t);
    if(!c||!S.session.includes(c.inn)) return `<p>Не нашёл такого контрагента в сессии. Сейчас в сессии: ${names(cs())||'никого'}.</p>`;
    S.session=S.session.filter(i=>i!==c.inn); S.focus=S.focus.filter(i=>i!==c.inn); if(S.focus.length<2) S.focusMode=false; if(S.selected===c.inn) S.selected=S.session[0];
    S.ctx=S.session.length>1?'compare':'company';
    return `<p>Убрал ${esc(c.name)} из сессии. Осталось ${S.session.length}.</p>`;
  }
  if(inns.length){
    const res=inns.map(addInn);
    if(inns.length===1) return res[0].html;
    S.ctx='compare'; setView('compare');
    return `<p>Обработал ${inns.length} ИНН: добавлено ${res.filter(r=>r.ok).length}, не найдено ${res.filter(r=>!r.ok).length}.</p>`+res.filter(r=>!r.ok).map(r=>r.html).join('')+(S.session.length>1?totalsHtml():'');
  }
  const amt=t.match(/(\d+(?:[.,]\d+)?)\s*(млрд|млн|тыс)/); const goal=/госзакуп|тендер/.test(t)?'госзакупка':/поставк/.test(t)?'поставка':/без контекста/.test(t)?null:undefined;
  if((amt&&/контракт|сделк|сумм|планиру|договор/.test(t))||goal!==undefined&&/цель|контекст|поставк|госзакуп/.test(t)){
    if(amt){ const v=parseFloat(amt[1].replace(',','.')); S.deal.amount=amt[2]==='млрд'?v*1000:amt[2]==='млн'?v:v/1000; }
    if(goal!==undefined) S.deal.goal=goal;
    const hit=cs().filter(c=>S.deal.amount&&dealCell(c)[0]==='caution');
    if(S.session.length>1) setView('compare');
    return `<p>Запомнил контекст сделки: ${[S.deal.goal, S.deal.amount?mlnT(S.deal.amount):null].filter(Boolean).join(', ')}. ${S.deal.amount&&S.session.length?`${S.session.length>1?'В сравнении появилась строка «Соразмерность сделки»':'Краткий вывод обновлён с учётом сделки'}${hit.length?`: сумма превышает годовую выручку у ${names(hit)} ${ref('finReports[].common.proceeds')}`:''}.`:''} Метки банка не пересчитываются.</p>${S.session.length===1&&!S.llmOff?llmBriefHtml(DB[S.session[0]]):''}${S.session.length>1?`<div class="actions"><button class="chip go" data-pview="compare">Матрица в панели →</button></div>`:''}`;
  }
  if(!S.session.length) return `<p>В сессии пока никого. Введите ИНН — 10 цифр для юрлица или 12 для ИП, или напишите «доступные ИНН».</p>`;
  const many=S.session.length>1;
  /* Явное упоминание компании переключает «текущую» */
  const mentioned=findAllByName(t);
  if(mentioned.length===1) S.selected=mentioned[0].inn;
  if(many&&mentioned.length>=2&&/сравни|подробн|против|и /.test(t)){
    S.focus=mentioned.slice(0,4).map(c=>c.inn); S.focusMode=true; setView('compare'); S.ctx='focus';
    return `<p>Подробное сравнение: ${names(mentioned.slice(0,4))}. Различия по критериям:</p>${diffsList(mentioned.slice(0,4))}<div class="actions"><button class="chip go" data-pview="compare">Таблица колонками в панели →</button><button class="lnk" data-q="Покажи матрицу">ко всем ${S.session.length}</button></div>`;
  }
  if(/расскажи|покажи сводку|сводк|что по|карточк|подробнее о/.test(t)&&(mentioned.length===1||!many)){ const c=DB[S.selected]; setView('card',c.inn); S.ctx='company'; return summaryHtml(c); }
  if(many&&/матриц|ко всем|всех|все компании/.test(t)){ S.focusMode=false; S.filter='all'; setView('compare'); S.ctx='compare'; return `<p>Матрица сигналов по всем ${S.session.length} — в панели. Строки идут по возрастанию риска, ключ порядка подписан под таблицей.</p><div class="actions"><button class="chip go" data-pview="compare">Открыть матрицу →</button></div>`; }

  if(many&&/пробел|не хватает|нет данных|недостаточно/.test(t)&&mentioned.length!==1&&!['company','fin','legal'].includes(S.ctx)){ const l=cs().filter(c=>c.gaps.length); S.filter='gap'; setView('compare'); S.ctx='compare'; return `<p>Пробелы в данных у ${l.length} из ${S.session.length}:</p>${l.map(c=>`<p><b>${esc(c.short)}</b></p>${c.gaps.map(gapFact).join('')}`).join('')}${gapsNote()}<div class="actions"><button class="chip go" data-pview="compare">Матрица с фильтром в панели →</button></div>`; }
  if(many&&/по годам|динамик/.test(t)){ S.metric=/прибыл/.test(t)?'pf':/капитал/.test(t)?'cap':/обязательств/.test(t)?'stl':/актив/.test(t)?'ca':'pr'; S.hiddenLines.clear(); setView('chart'); S.ctx='chart'; return trendText(); }
  if(many&&/лучше|надёжн|надежн|с кем работать|кого выбрать|самый/.test(t)){ setView('compare'); S.ctx='diffs'; return `<p>Не ранжирую компании — перечислю различия, решение за вами.</p>${diffsList()}<p>Отсутствие фактов не означает отсутствие риска: у ${names(cs().filter(c=>c.gaps.length))||'никого'} есть пробелы в данных.</p><div class="actions"><button class="chip go" data-pview="compare">Матрица в панели →</button></div>`; }
  if(many&&/различ|сравн|итог/.test(t)){ S.focusMode=false; setView('compare'); S.ctx='diffs'; return totalsHtml()+`<details class="fold"><summary>различия по критериям текстом</summary>${diffsList()}</details>`; }
  const c=DB[S.selected];
  const who=many?`${esc(c.short)}: `:'';
  const other=many?`<div class="small tertiary" style="margin-top:6px">Отвечаю по ${esc(c.short)}; о другой компании — клик по чипу или имя в вопросе.</div>`:'';
  if(/оценк|риск|почему/.test(t)){
    S.ctx='company'; setView('card',c.inn);
    const neg=c.facts.slice(1).filter(f=>f.pol==='negative'||f.pol==='caution');
    if(c.risk==='HIGH'&&!neg.some(f=>f.pol==='negative')) return `<p>Банк присвоил ${esc(c.name)} высокий уровень риска ${ref('baseInfo.riskLevel')}${c.zsk!=='GREEN'?` и метку ЗСК «${ZSK[c.zsk][0].replace('ЗСК ','')}» ${ref('zskRiskLevel')}`:''}. Факты отчёта эту метку не раскрывают: негативных сигналов правила не нашли${neg.length?`, требуют внимания: ${neg.map(f=>esc(lc(f.text).replace(/\.$/,''))).join('; ')}`:''}.</p><div class="gapbox">Модель риска банка учитывает данные, которых в отчёте нет; объяснить метку по отчёту нельзя, и оспаривать её я не буду.</div><p>Что проверить: ${c.steps.map(s=>esc(lc(s.text).replace(/\.$/,''))).join('; ')}.</p>${other}`;
    return `<p>Банк присвоил ${esc(c.name)} метку «${RISK[c.risk][0]}» ${ref('baseInfo.riskLevel')}, ЗСК — «${ZSK[c.zsk][0].replace('ЗСК ','')}» ${ref('zskRiskLevel')}. Метку я не пересчитываю. Факты отчёта рядом с ней:</p>${c.headline?`<div class="err">${esc(c.headline)}</div>`:''}<ul>${c.facts.slice(1).map(f=>`<li>${esc(f.text)} ${ref(f.refs[0])}</li>`).join('')}</ul>${other}`;
  }
  if(/финанс|выручк|прибыл/.test(t)){
    S.ctx='fin'; setView('card',c.inn);
    const fin=c.fin.filter(f=>f.pr); if(!fin.length) return `<p>${who}выручка в отчётности не указана ни за один год ${ref('finReports')}.</p><div class="gapbox">Недостаточно данных для оценки финансов${c.isIP?' — ИП не публикует отчётность':''}.</div>${other}`;
    return `<p>${who}выручка ${fin.map(f=>`${mln(f.pr)} (${f.y})`).join(' → ')} ${ref('finReports[].common.proceeds')}. ${fin.length<2?'Тренд по одному году оценить нельзя.':''} ${esc(c.facts.find(f=>f.slot==='Финансы').text)}</p>${c.fin.every(f=>f.pf==null)?'<div class="gapbox">Прибыль в отчётности не указана.</div>':''}<div class="actions"><button class="chip go" data-pview="card" data-inn="${c.inn}" data-block="B">Блок «Финансы» в панели →</button>${many?`<button class="lnk" data-q="Выручка по годам">сравнить динамику по компаниям</button>`:''}</div>${other}`;
  }
  if(/долг|суд|арбитраж|исполнительн/.test(t)){
    S.ctx='legal'; setView('card',c.inn);
    const a=c.arb, ep=c.ep.activeTotal??c.ep.active.length;
    return `<p>${who}${ep?`активные исполнительные производства: ${ep}${c.ep.activeSum?` на ${c.ep.activeSum}`:''}${c.ep.active.some(e=>!e.a)?', сумма не указана':''} ${ref('executionProceedings[].active')}.`:`исполнительные производства не найдены ${ref('executionProceedings')}.`} ${a?`Арбитраж: всего ${a.total} дел, из них как истец ${a.pf+a.pa+a.pp}, как ответчик ${a.df+a.da+a.dp}${a.dp?`; открытых как ответчик ${a.dp}${a.dpA?' на '+a.dpA:''}`:'; открытых как ответчик нет'} ${ref('arbitrationByStatus')}.`:`Арбитражные дела не найдены ${ref('arbitrationByStatus')}.`}</p>${c.insp?`<p>Проверок контролирующих органов: ${c.insp.total}, нарушений не выявлено ${ref('inspections[]')}.</p>`:gapFact({text:'сведений о проверках контролирующих органов в отчёте нет',ref:'inspections'})}<div class="actions"><button class="chip go" data-pview="card" data-inn="${c.inn}" data-block="C">Блок «Юридические события» в панели →</button></div>${other}`;
  }
  if(/не хватает|пробел|нет данных|недостаточно/.test(t)){ S.ctx='company'; return (c.gaps.length?`${c.gaps.map(gapFact).join('')}${gapsNote()}`:`<p>${who}все разделы отчёта банка заполнены; пробелов в данных нет.</p>`)+other; }
  if(/провер|запрос|до сделки|документ/.test(t)){ S.ctx='company'; return `<p>${who}до сделки:</p><ol>${c.steps.map(s=>`<li>${esc(s.text)} <span class="muted small">(${esc(s.why)})</span></li>`).join('')}</ol>${many?`<div class="actions"><button class="lnk" data-pview="compare">шаги по всем ${S.session.length} — в панели</button></div>`:''}${other}`; }
  if(/сотрудник|штат|клиент|сайт|интернет/.test(t)) return `<p>В доступных данных этой информации нет.</p><div class="gapbox">Веб-поиск не подключён; отвечаю только по отчёту банка.</div>`;
  return `<p>Могу ответить про оценку банка, финансы, исполнительные производства и арбитраж, реестры ФНС, пробелы в данных, что проверить до сделки${many?'; по нескольким — различия, динамика по годам, «сравни А и Б подробно»':''}. Управление сессией тоже здесь: ИНН добавляет контрагента, «убери …» удаляет, «контракт на 50 млн, поставка» задаёт контекст сделки.</p>`;
}
/* Три подсказки под последним ответом, по контексту */
function suggestions(){
  const base=suggestBase(), last=(S.lastQ||'').toLowerCase();
  const pool=['В чём различия?','Выручка по годам','Что проверить до сделки?','У кого предупреждения?','Что с финансами?'];
  const out=base.filter(p=>p.toLowerCase()!==last);
  if(!S.session.length) return out;
  for(const p of pool){ if(out.length>=3||S.session.length<2&&/различ|предупрежд|по годам/.test(p)) continue; if(!out.includes(p)&&p.toLowerCase()!==last) out.push(p); }
  return out.slice(0,3);
}
function suggestBase(){
  const n=S.session.length, c=DB[S.selected];
  if(!n) return ['Доступные ИНН','проверь 9721159668'];
  if(n===1){
    if(S.ctx==='fin') return ['Есть ли долги и суды?','Чего не хватает в отчёте?','Что проверить до сделки?'];
    if(S.ctx==='legal') return ['Что с финансами?','Чего не хватает в отчёте?','Что проверить до сделки?'];
    return ['Что с финансами?','Что проверить до сделки?','Доступные ИНН'];
  }
  const two=cs().slice(0,2);
  switch(S.ctx){
    case 'compare': case 'diffs': return n<=4?['У кого предупреждения?',`Сравни ${two[0].short} и ${two[1].short} подробно`,'Выручка по годам']:['Покажи только с негативными','У кого предупреждения?','Выручка по годам'];
    case 'focus': return ['Выручка по годам','Покажи матрицу','Что проверить до сделки?'];
    case 'chart': return [S.metric==='pr'?'Прибыль по годам':'Выручка по годам','В чём различия?','Покажи матрицу'];
    case 'fin': return ['Выручка по годам',`Есть ли долги и суды?`,'В чём различия?'];
    case 'legal': return ['Что с финансами?','В чём различия?','Что проверить до сделки?'];
    default: return c?[`Что с финансами?`,'В чём различия?','Что проверить до сделки?']:['В чём различия?','У кого предупреждения?','Выручка по годам'];
  }
}
function renderSuggest(){
  document.querySelectorAll('.suggest').forEach(e=>e.remove());
  const last=[...document.querySelectorAll('.msg.agent')].pop(); if(!last) return;
  const s=document.createElement('div'); s.className='suggest';
  s.innerHTML=`<span class="lbl">Дальше:</span>`+suggestions().map(p=>`<button class="chip" data-q="${esc(p)}">${esc(p)}</button>`).join('');
  last.appendChild(s); $('#msgs').scrollTop=1e9;
}
function addMsg(role,html){ const m=document.createElement('div'); m.className='msg '+role; m.innerHTML=html; $('#msgs').appendChild(m); $('#msgs').scrollTop=1e9; return m; }
function finish(sk,a){
  sk.innerHTML=a;
  renderAll(); renderSuggest();
}
function send(text){
  if(!text.trim()) return;
  $('#chat').classList.remove('empty-session');
  S.lastQ=text; addMsg('user',esc(text)); $('#chatInput').value=''; $('#launcherInput').value='';
  const isCmd=/\d{10,12}/.test(text)||/^(убери|удали|очист|доступн|расскажи|покажи|сравни|матриц)/i.test(text.trim())||/по годам|различ/i.test(text);
  if(S.llmOff&&!isCmd){ addMsg('agent',`<div class="sys">Языковая модель недоступна. Сводки и сравнение формируются по правилам: напишите ИНН, «расскажи о …», «в чём различия», «покажи матрицу». Команды сессии («убери», «очисти») работают.</div>`); renderSuggest(); return; }
  const sk=addMsg('agent',`<div class="skeleton"><i style="width:80%"></i><i style="width:95%"></i><i style="width:60%"></i></div>`);
  setTimeout(()=>finish(sk,agentAnswer(text)),500);
}
function greet(){
  $('#msgs').innerHTML='';
  $('#chat').classList.toggle('empty-session',!S.session.length);
  if(!S.session.length){ S.ctx='start'; $('#launcherInput').value=''; return; }
  addMsg('user','проверь '+S.session.join(', '));
  if(S.session.length===1){ S.ctx='company'; addMsg('agent',summaryHtml(DB[S.session[0]])); renderSuggest(); return; }
  S.ctx='compare'; addMsg('agent',totalsHtml(true)); renderSuggest();
}

/* ---------- Подсветка блока по внутренней привязке факта ---------- */
function blockFor(r){
  const map=[[/^(status|baseInfo|reportDate)/,'A'],[/^(finReports|coefficient)/,'B'],[/^(executionProceedings|arbitration|inspections)/,'C'],[/^reputationalRisks/,'D'],[/^(foundersInfo|licenses|procurements|relatedCompanies)/,'E']];
  return (map.find(([re])=>re.test(r))||[0,'A'])[1];
}
function collapseCardBlocks(){ document.querySelectorAll('#dBody .block').forEach(el=>{ el.open=false; }); }
function highlight(b){ collapseCardBlocks(); const el=$('#blk-'+b); if(!el) return; el.open=true; el.classList.add('hl'); el.scrollIntoView({block:'start',behavior:'smooth'}); setTimeout(()=>el.classList.remove('hl'),1500); }
function openRef(r,inn){ openPanel('card',inn||S.selected); highlight(blockFor(r)); }

/* ---------- События ---------- */
function renderAll(){ renderChips(); renderPanel(); }
const innOf = el => { const m=el.closest('.msg'); const h=m&&m.querySelector('[data-inn]'); return h?h.dataset.inn:null; };
document.addEventListener('click',e=>{
  const t=e.target, d=t.dataset, cl=s=>t.closest(s);
  if(d.del){ e.stopPropagation(); send('убери '+DB[d.del].short); }
  else if(d.deldeal){ S.deal={goal:null,amount:null}; renderAll(); }
  else if(d.clear){ e.preventDefault(); if(confirm('Очистить сессию? Контрагенты, контекст сделки и история чата будут сброшены.')){ S.session=[]; S.deal={goal:null,amount:null}; S.focus=[]; S.focusMode=false; S.panel='closed'; renderAll(); greet(); } }
  else if(cl('.cchip[data-inn]')){ send('расскажи о '+DB[cl('.cchip').dataset.inn].short); }
  else if(t.classList.contains('ref')){ e.stopPropagation(); openRef(d.ref, cl('.msg')?innOf(t):null); }
  else if(cl('.fact')){ openRef(cl('.fact').dataset.ref, cl('.msg')?innOf(t):null); }
  else if(d.pview){ openPanel(d.pview, d.inn); if(d.block) highlight(d.block); }
  else if(d.pclose){ S.panel='closed'; renderAll(); }
  else if(t.id==='pwide'||cl('#pwide')){ S.panel=S.panel==='wide'?'open':'wide'; renderAll(); }
  else if(cl('#rail')){ S.panel='open'; renderAll(); }
  else if(d.pick!==undefined){ S.focus=t.checked?[...S.focus,d.pick]:S.focus.filter(i=>i!==d.pick); renderPanel(); }
  else if(d.focus){ S.focusMode=true; renderPanel(); }
  else if(d.unfocus){ S.focusMode=false; renderPanel(); }
  else if(d.filter){ S.filter=d.filter; renderPanel(); }
  else if(d.expand){ S.expanded=!S.expanded; renderPanel(); }
  else if(d.metric){ S.metric=d.metric; S.hiddenLines.clear(); renderPanel(); }
  else if(d.toggle){ S.hiddenLines.has(d.toggle)?S.hiddenLines.delete(d.toggle):S.hiddenLines.add(d.toggle); renderPanel(); }
  else if(cl('[data-open]')){ openPanel('card', cl('[data-open]').dataset.open); }
  else if(d.ep){ S.epView=d.ep; renderPanel(); }
  else if(d.q){ send(d.q); }
  else if(cl('tr.pick')){ send('проверь '+cl('tr.pick').dataset.add); }
  else if(d.state){ document.querySelectorAll('.devbar [data-state]').forEach(b=>b.classList.toggle('on',b===t)); S.session=[...SETS[d.state]]; S.selected=S.session[0]; S.focus=[]; S.focusMode=false; S.filter='all'; S.panel='closed'; S.view={kind:S.session.length>1?'compare':'card',inn:S.selected}; renderAll(); greet(); }
});
document.addEventListener('mouseover',e=>{ const h=e.target.closest('[data-hover]'); const ch=$('#ychart'); if(!ch) return; if(h){ ch.classList.add('dim'); ch.querySelectorAll('[data-line]').forEach(g=>g.querySelectorAll('.ln,.pt,.end').forEach(x=>x.classList.toggle('on',g.dataset.line===h.dataset.hover))); } else { ch.classList.remove('dim'); } });
$('#llmToggle').onclick=()=>{ S.llmOff=!S.llmOff; $('#llmToggle').textContent='LLM недоступна: '+(S.llmOff?'вкл':'выкл'); $('#llmToggle').classList.toggle('on',S.llmOff); renderAll(); greet(); };
$('#sendBtn').onclick=()=>send($('#chatInput').value);
$('#chatInput').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send($('#chatInput').value);} });
$('#launcherBtn').onclick=()=>send($('#launcherInput').value);
$('#launcherInput').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); send($('#launcherInput').value);} });

/* Начальное состояние из hash: #empty | #one | #three | #ten · #panel | #wide (панель открыта) · #card | #compare | #chart (что в панели) · #t2 | #t3 · #llmoff · #deal · #focus · #neg (через запятую) */
const H=(location.hash||'').slice(1).split(',');
const setName=['empty','one','three','ten'].find(s=>H.includes(s))||'ten';
S.session=[...SETS[setName]];
S.selected=H.includes('t3')?'9714079997':H.includes('t2')?'1660266560':S.session[0];
S.view={kind:H.includes('card')?'card':H.includes('chart')?'chart':H.includes('compare')?'compare':(S.session.length>1?'compare':'card'),inn:S.selected};
if(H.includes('panel')) S.panel='open'; if(H.includes('wide')) S.panel='wide';
if(H.includes('llmoff')){S.llmOff=true; $('#llmToggle').textContent='LLM недоступна: вкл'; $('#llmToggle').classList.add('on');}
if(H.includes('deal')){S.deal={goal:'поставка',amount:100};}
if(H.includes('focus')&&S.session.length>=3){ S.focus=S.session.slice(0,3); S.focusMode=true; }
if(H.includes('neg')) S.filter='neg';
document.querySelectorAll('.devbar [data-state]').forEach(b=>b.classList.toggle('on',b.dataset.state===setName));
renderAll(); greet();
</script>
</body>
</html>
